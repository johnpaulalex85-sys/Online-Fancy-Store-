<div class="product-card-nimble">
    <!-- Image Box with Wishlist & Quick Add Buttons -->
    <div class="product-thumb-nimble">
        {% if prod.discount > 0 %}
        <span class="badge position-absolute top-0 start-0 m-2 bg-danger text-white rounded-pill font-xs px-2 py-1" style="z-index: 3;">
            {{ prod.discount | int }}% OFF
        </span>
        {% endif %}

        <!-- Wishlist Button -->
        <button type="button"
            class="btn-wishlist-circle btn-wishlist-toggle {% if prod.id in session.get('wishlist_items', []) %}active{% endif %}"
            data-product-id="{{ prod.id }}" aria-label="Save to Wishlist" title="Save to Wishlist">
            <i class="{% if prod.id in session.get('wishlist_items', []) %}fas fa-heart text-danger{% else %}far fa-heart{% endif %}"></i>
        </button>

        <!-- Product Image Link -->
        <a href="{{ url_for('main.product_detail', slug=prod.slug) }}" class="d-flex align-items-center justify-content-center w-100 h-100">
            <img src="{{ prod.thumbnail }}" alt="{{ prod.name }}"
                onerror="this.src='https://placehold.co/400x400?text=No+Product+Image'">
        </a>

        <!-- Quick Add to Cart Circle Button -->
        {% if prod.in_stock %}
        <form action="{{ url_for('cart.add_to_cart') }}" method="POST" class="d-inline m-0">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="product_id" value="{{ prod.id }}">
            <input type="hidden" name="quantity" value="1">
            <button type="submit" class="btn-quick-cart-circle" aria-label="Add to Cart" title="Add to Cart">
                <i class="fas fa-shopping-bag"></i>
            </button>
        </form>
        {% endif %}
    </div>

    <!-- Product Text Details -->
    <div class="d-flex flex-column flex-grow-1">
        <a href="{{ url_for('main.product_detail', slug=prod.slug) }}" class="text-decoration-none">
            <h6 class="product-title-nimble" title="{{ prod.name }}">{{ prod.name }}</h6>
        </a>

        <!-- Price -->
        <div class="product-price-nimble">
            <span>{{ prod.price_after_discount | currency }}</span>
            {% if prod.discount > 0 %}
            <span class="product-price-original">{{ prod.regular_price | currency }}</span>
            {% endif %}
        </div>

        <!-- Star Rating -->
        <div class="product-stars-row">
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
            <i class="fas fa-star"></i>
            <i class="fas fa-star-half-alt"></i>
            <span class="product-reviews-count">({{ prod.rating_count or 128 }})</span>
        </div>
    </div>
</div>
