{% extends "base.html" %}
{% block title %}500 Internal Server Error - Fancy Store{% endblock %}
{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger mb-3">500</h1>
        <h2 class="fw-bold mb-3">Internal Server Error</h2>
        <p class="text-muted lead max-w-md mx-auto mb-4">
            We encountered an unexpected technical issue on our end. Our engineering team has been notified.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-fancy-primary rounded-pill px-5">
            <i class="fas fa-redo me-2"></i>Try Again
        </a>
    </div>
</div>
{% endblock %}
