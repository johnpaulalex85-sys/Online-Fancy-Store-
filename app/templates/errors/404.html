{% extends "base.html" %}
{% block title %}404 Page Not Found - Fancy Store{% endblock %}
{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-primary mb-3">404</h1>
        <h2 class="fw-bold mb-3">Page Not Found</h2>
        <p class="text-muted lead max-w-md mx-auto mb-4">
            Oops! The product, category, or page you are looking for does not exist or has been moved.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-fancy-primary rounded-pill px-5">
            <i class="fas fa-home me-2"></i>Return to Storefront
        </a>
    </div>
</div>
{% endblock %}
