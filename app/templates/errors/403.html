{% extends "base.html" %}
{% block title %}403 Forbidden Access - Fancy Store{% endblock %}
{% block content %}
<div class="container py-5 text-center my-5">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-warning mb-3">403</h1>
        <h2 class="fw-bold mb-3">Access Forbidden</h2>
        <p class="text-muted lead max-w-md mx-auto mb-4">
            You do not have the required permissions to view this resource or administrative area.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.index') }}" class="btn btn-fancy-primary rounded-pill px-4">
                <i class="fas fa-home me-2"></i>Storefront
            </a>
            <a href="{{ url_for('auth.admin_login') }}" class="btn btn-outline-primary rounded-pill px-4">
                <i class="fas fa-lock me-2"></i>Admin Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
